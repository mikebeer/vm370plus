# /etc/mosquitto/mosquitto.conf -- VM/370plus (9.25, 9.32)
user root
per_listener_settings true
log_dest file /var/log/mosquitto.log

# local: CMS (MQTT EXEC through the spool bridge), the TELL gateway,
# Linux programs -- no login
listener 1883 127.0.0.1
allow_anonymous true

# outside: the guest's own address, which the PC forwards (tools/netfwd.py)
# -- a login (tellnet-user) and only the TELL topics
listener 1883 10.1.1.2
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
