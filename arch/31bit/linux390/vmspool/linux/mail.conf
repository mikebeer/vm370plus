# /etc/vmspool.d/mail.conf -- VM/370plus mail (9.18): vmmaild and SENDMAIL
# The mail domain(s) of the CMS users: mail for userid@DOMAIN goes to the
# reader of userid (GETMAIL on CMS).  The first is the senders' domain.
DOMAIN=vm370plus.lan
# Mail to other domains: through a smarthost (host[:port], as most
# providers want), or, empty, straight to the domain's MX on port 25.
SMARTHOST=
SMARTUSER=
SMARTPASS=
SMARTTLS=no
# Where vmmaild takes mail in (BORDER CONFIG: EXPOSE TCP 25 TO 10.3.0.2 25
# and MX 10 MAINT make it reachable from the PC and the LAN by name).
LISTEN=0.0.0.0:25
