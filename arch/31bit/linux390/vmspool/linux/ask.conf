# /etc/vmspool.d/ask.conf -- VM/370plus AI gateway (9.10): ASK on CMS, ask on Linux
# A model server with the OpenAI chat-completions protocol: llama.cpp's
# llama-server on the PC (llama-server -m model.gguf --host 0.0.0.0 --port 8080),
# Ollama (http://10.1.1.1:11434/v1/chat/completions), LM Studio, OpenAI ...
API=openai
URL=http://10.1.1.1:8080/v1/chat/completions
MODEL=local
APIKEY=
# or Anthropic's API (needs internet through the PC or BORDER):
# API=anthropic
# URL=https://api.anthropic.com/v1/messages
# MODEL=claude-sonnet-5-5
# APIKEY=sk-ant-...
MAXTOKENS=800
TIMEOUT=300
# earlier questions and answers a user's next question carries (0: none)
HISTORY=6
